<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PenForge</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg:      '#0a0a0a',
              surface: '#111111',
              border:  '#1f1f1f',
              primary: '#dc2626',
              'primary-hover': '#b91c1c',
            },
            fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
            animation: {
              shake: 'shake 0.4s ease-in-out',
              'fade-in': 'fadeIn 0.2s ease',
              'slide-up': 'slideUp 0.25s ease',
            },
            keyframes: {
              shake: {
                '0%,100%': {transform:'translateX(0)'},
                '20%':     {transform:'translateX(-8px)'},
                '40%':     {transform:'translateX(8px)'},
                '60%':     {transform:'translateX(-5px)'},
                '80%':     {transform:'translateX(5px)'},
              },
              fadeIn:  {from:{opacity:'0'},to:{opacity:'1'}},
              slideUp: {from:{opacity:'0',transform:'translateY(12px)'},to:{opacity:'1',transform:'translateY(0)'}},
            }
          }
        }
      }
    </script>
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; background: #0a0a0a; color: #f5f5f5; font-family: Inter, system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #111; }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
      ::selection { background: rgba(220,38,38,0.3); }
      .pin-digit { width:56px; height:72px; background:#111; border:2px solid #1f1f1f; border-radius:12px; font-size:32px; font-weight:700; color:#f5f5f5; text-align:center; outline:none; transition:border-color .15s,box-shadow .15s; caret-color:transparent; }
      .pin-digit:focus { border-color:#dc2626; box-shadow:0 0 0 3px rgba(220,38,38,0.2); }
      .pin-digit.filled { border-color:#dc2626; }
      @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
      .animate-shake { animation: shake 0.4s ease-in-out; }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      .animate-fade-in { animation: fadeIn 0.2s ease; }
      @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
      .animate-slide-up { animation: slideUp 0.25s ease; }
      .glow-red { box-shadow: 0 0 20px rgba(220,38,38,0.3); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
